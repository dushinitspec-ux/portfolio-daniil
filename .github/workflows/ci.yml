name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-fridge-alert-bot
          - 02-hotel-ai-concierge
          - 03-uptime-monitor
          - 04-pii-guard
          - 05-e-invoice
          - 06-helpdesk-copilot
          - 07-network-inventory
          - 08-accessibility-check
          - 09-energy-saver
          - 10-allergen-labels
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest

  site:
    name: site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and type-check
        run: npm run lint && npm run typecheck
      - name: Build
        run: npm run build
