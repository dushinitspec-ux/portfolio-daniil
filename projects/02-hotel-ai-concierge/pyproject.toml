[project]
name = "hotel-ai-concierge"
version = "0.1.0"
description = "Telegram concierge that answers hotel guests in EN/RU/TR/DE from a knowledge base."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "anthropic>=2.3.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# The bot speaks Russian and Turkish: Cyrillic letters and the dotless "ı" are intentional,
# not look-alike characters smuggled into the code.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
