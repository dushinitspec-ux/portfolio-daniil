[project]
name = "pii-guard"
version = "0.1.0"
description = "Gateway that masks personal data in prompts before they reach an LLM and restores it in the answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "phonenumbers>=9.0.41",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Detectors and tests use German, Turkish and Russian words ("geb.", "doğum", "родился"):
# those letters are intentional, not look-alike characters smuggled into the code.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
