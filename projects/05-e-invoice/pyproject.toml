[project]
name = "e-invoice"
version = "0.1.0"
description = "Turns a PDF invoice into an XRechnung UBL e-invoice and checks EN 16931 business rules."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "lxml>=6.0.0",
    "pdfplumber>=0.11.7",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.4",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
# Only for scripts/official_check.py: runs the official XSLT 2.0 schematron with Saxon-HE.
official = [
    "saxonche>=12.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Invoices are parsed in German: umlauts, "§" and "×" in patterns are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
