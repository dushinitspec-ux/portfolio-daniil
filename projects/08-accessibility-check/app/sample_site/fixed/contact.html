<!doctype html>
<!-- SAMPLE PAGE, fixed version of ../broken/contact.html, for the Accessibility Check demo. -->
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Sample Shop</title>
<link rel="stylesheet" href="../shop.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="banner">Demo page, fixed version. Not a real shop.</div>
<header>
  <img src="../img/logo.svg" alt="Sample Shop" width="160" height="40">
  <nav aria-label="Main">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About us</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>
<main id="main">
  <h1>Contact us</h1>
  <form action="#">
    <p><label for="name">Your name</label><input type="text" id="name" name="name" autocomplete="name"></p>
    <p><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="email"></p>
    <p><label for="email-repeat">Repeat your e-mail</label><input type="email" id="email-repeat" name="email2"></p>
    <p><label for="topic">Topic</label><select id="topic" name="topic"><option>Order</option><option>Return</option><option>Other</option></select></p>
    <p><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea></p>
    <p><button type="submit">Send message</button></p>
  </form>
  <h2>Find us</h2>
  <iframe src="../map.html" title="Map: where to find Sample Shop (placeholder)" width="400" height="200"></iframe>
</main>
</body>
</html>
