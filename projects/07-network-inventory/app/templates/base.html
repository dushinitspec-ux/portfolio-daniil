<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Network inventory{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f3ee; --fg: #111111; --muted: #5e5a52; --surface: #ece9e2;
      --line: rgba(17, 17, 17, .14); --strong: #111111;
      --accent: #ff4f1f; --accent-text: #c2330a;
      --sans: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110; --fg: #edeae3; --muted: #a39e94; --surface: #1b1a18;
        --line: rgba(237, 234, 227, .14); --strong: #edeae3;
        --accent: #ff6338; --accent-text: #ff7852;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
    a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    main { max-width: 1360px; margin: 0 auto; padding: 32px 24px 64px; }
    .label { font: 500 11px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .mono { font-family: var(--mono); font-size: 13px; }
    .muted { color: var(--muted); }
    .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px;
           border-bottom: 2px solid var(--strong); padding-bottom: 16px; }
    h1 { font-size: 40px; line-height: 1; letter-spacing: -.03em; font-weight: 600; margin: 8px 0 0; }
    h2 { font-size: 13px; font-family: var(--mono); font-weight: 500; text-transform: uppercase; letter-spacing: .04em;
         margin: 40px 0 0; padding: 0 0 10px; border-bottom: 1px solid var(--strong); display: flex; justify-content: space-between; gap: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .button { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px;
              border: 1px solid var(--strong); background: transparent; color: var(--fg); text-decoration: none; cursor: pointer; }
    .button.primary { background: var(--fg); color: var(--bg); }
    .button:disabled { opacity: .5; cursor: default; }
    .demo { font: 500 11px/1 var(--mono); text-transform: uppercase; padding: 5px 8px; border: 1px dashed var(--muted); color: var(--muted); }
    .badge { display: inline-block; font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .03em;
             padding: 4px 6px; margin: 0 4px 4px 0; border: 1px solid var(--muted); color: var(--muted); white-space: nowrap; }
    .badge.high { background: var(--accent); border-color: var(--accent); color: #111111; }
    .badge.medium { border-color: var(--accent); color: var(--accent-text); }
    .badge.new { background: var(--fg); border-color: var(--fg); color: var(--bg); }
    .flag { display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); }
    th { font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 14px; }
    .scroll { overflow-x: auto; }
    .empty { padding: 24px 0; color: var(--muted); }
    @media (max-width: 760px) {
      main { padding: 20px 16px 48px; }
      h1 { font-size: 30px; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
